<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Coach</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <!--  放入這三行開始 -->
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
<!--  放入這三行結束 -->
</head>
<body>

  <main class="main">
    <div class="content">
      <header class="header">
        <div class="logo">
          <!-- SVG Logo directly embedded -->
          <svg width="180" height="54" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#FFDDBB;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#B2C8DF;stop-opacity:1" />
              </linearGradient>
            </defs>
            <g transform="translate(10, 10)">
              <path d="M 0 20 Q 10 0, 20 20 T 40 20" stroke="url(#grad1)" stroke-width="4" fill="none" stroke-linecap="round"/>
              <path d="M 5 20 Q 15 40, 25 20 T 45 20" stroke="url(#grad1)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
            </g>
            <text x="65" y="38" font-size="20" fill="#4A4A4A" font-weight="600">
              Energy Coach
            </text>
          </svg>
        </div>
        <div class="info-bar" id="info-bar">
          <!-- Info chips will be inserted here by JavaScript -->
        </div>
      </header>

      <div class="quote-display" id="quote-display">
        <p>點擊按鈕來索取你的今日小語。</p>
      </div>

      <button class="cta-button" id="cta-button">
        索取小語
      </button>
    </div>
  </main>

  <script src="client.js"></script>
</body>
</html>
